name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  package:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate the release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (process.env.GITHUB_REF.startsWith("refs/tags/") && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`The release tag must match package.json: v${version}`);
          }
          const npmTag = version.includes("-") ? "next" : "latest";
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nnpm_tag=${npmTag}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types, all tests, and build
        run: npm run check:ci

      - name: Verify and save the installed package
        run: npm run test:package -- release

      - name: Upload the checked package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Publish to npm
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the verified commit for provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11

      - name: Download the checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      - name: Verify the package checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Publish the checked archive using npm trusted publishing
        env:
          NPM_TAG: ${{ needs.package.outputs.npm_tag }}
        run: npm publish ./release/*.tgz --access public --provenance --tag "$NPM_TAG"

  github-packages:
    name: Publish to GitHub Packages
    needs: [package, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@priyadharshan0903"
          package-manager-cache: false

      - name: Download the checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      - name: Verify the package checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS

      # GitHub Packages accepts only scoped npm names, so publish the checked files under the
      # owner's scope. The package's repository field links it to this repository.
      - name: Publish the checked files under the owner scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TAG: ${{ needs.package.outputs.npm_tag }}
        run: |
          mkdir scoped
          tar --extract --gzip --file release/*.tgz --directory scoped
          cd scoped/package
          npm pkg set name=@priyadharshan0903/runlens
          npm publish --ignore-scripts --tag "$NPM_TAG"

  release:
    name: Publish GitHub release
    needs: [package, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download the checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      - name: Publish with release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.package.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          NPM_TAG: ${{ needs.package.outputs.npm_tag }}
        run: |
          flags=(--latest)
          if [[ "$NPM_TAG" != "latest" ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release/*.tgz release/SHA256SUMS \
            --target "$RELEASE_COMMIT" \
            --title "Runlens $RELEASE_TAG" \
            "${flags[@]}" \
            --generate-notes
