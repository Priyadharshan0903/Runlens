<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Runlens — a private workspace for inspecting Claude Code sessions, tool calls, file changes, and subagents."
    />
    <title>Runlens — Your agent workspace</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M5 5h7a8 8 0 1 1 0 16H5V5Zm0 8h9m-4-4 4 4-4 4m10 3 5 5' fill='none' stroke='%231b6c80' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before the first paint, including on a system-theme change.
      try {
        var theme = JSON.parse(localStorage.getItem("runlens.workspace.v1") || "null")?.theme;
        document.documentElement.dataset.theme =
          theme === "dark" || theme === "light"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
